name: Update publications from Google Scholar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Scholar client
        run: python -m pip install --disable-pip-version-check scholarly

      - name: Fetch selected publications and co-authors
        env:
          SCHOLAR_USER_ID: U67qcK8AAAAJ
          SCHOLAR_PUBLICATION_IDS: ${{ vars.SCHOLAR_PUBLICATION_IDS }}
        run: python scripts/update_publications_from_scholar.py

      - name: Commit updated publication data
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "Publication data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publications from Google Scholar"
          git push
